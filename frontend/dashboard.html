<!doctype html>
<html lang="sw">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Dashboard</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="nav"></div>
    <main class="container">
      <div class="top">
        <h1>Dashboard</h1>
        <button onclick="logout()">Logout</button>
      </div>
      <p id="welcome"></p>
      <div id="stats" class="grid"></div>
      <div class="card">
        <h2>Business Profile</h2>
        <form id="b">
          <input id="bn" placeholder="Business name" required /><input
            id="on"
            placeholder="Owner name"
            required
          /><input id="ph" placeholder="Phone" /><input
            id="loc"
            placeholder="Location"
          /><input id="cat" placeholder="Category" /><input
            id="addr"
            placeholder="Address"
          /><textarea id="desc" placeholder="Description"></textarea
          ><button>Save</button>
        </form>
        <p id="msg"></p>
      </div>
    </main>
    <script src="js/api.js"></script>
    <script>
      async function load() {
        let u = JSON.parse(localStorage.shop_user || "{}");
        welcome.textContent = "Karibu, " + u.full_name;
        let r = await api("/reports/dashboard");
        stats.innerHTML = [
          ["Mapato", r.revenue],
          ["Cost", r.cost_of_goods],
          ["Faida", r.net_profit],
          ["Expenses", r.expenses],
          ["Bidhaa", r.total_products],
          ["Low stock", r.low_stock_products],
          ["Customers", r.total_customers],
        ]
          .map(
            (x) =>
              `<div class="stat"><span>${x[0]}</span><b>TZS ${Number(x[1]).toLocaleString()}</b></div>`,
          )
          .join("");
        let x = await api("/businesses/me");
        if (x) {
          bn.value = x.name;
          on.value = x.owner_name;
          ph.value = x.phone || "";
          loc.value = x.location || "";
          cat.value = x.category || "";
          addr.value = x.address || "";
          desc.value = x.description || "";
        }
      }
      b.onsubmit = async (e) => {
        e.preventDefault();
        let d = {
          name: bn.value,
          owner_name: on.value,
          phone: ph.value || null,
          location: loc.value || null,
          category: cat.value || null,
          address: addr.value || null,
          description: desc.value || null,
        };
        let x = await api("/businesses/me");
        await api("/businesses/me", { method: x ? "PUT" : "POST", body: d });
        msg.textContent = "Business profile saved";
      };
      load();
    </script>
  </body>
</html>
