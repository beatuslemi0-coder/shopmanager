<!doctype html>
<html lang="sw">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />

    <title>Expenses</title>

    <link rel="stylesheet" href="css/style.css" />
</head>

<body>

    <!-- Navigation ya mfumo -->
    <div id="nav"></div>

    <main class="container">

        <h1>Expenses</h1>

        <!-- Form ya kuongeza expense -->
        <form id="expenseForm" class="card">

            <h2>Add Expense</h2>

            <input
                id="categoryInput"
                placeholder="Category e.g. Rent"
                required
            />

            <input
                id="amountInput"
                type="number"
                min="0.01"
                step="0.01"
                placeholder="Amount"
                required
            />

            <textarea
                id="descriptionInput"
                placeholder="Description"
            ></textarea>

            <button type="submit">
                Save Expense
            </button>

            <!-- Ujumbe wa success/error -->
            <p id="message"></p>

        </form>


        <!-- Sehemu ya kuonyesha expenses zote -->
        <section class="card">

            <div class="top">

                <h2>All Expenses</h2>

                <button
                    type="button"
                    id="refreshBtn"
                >
                    Refresh
                </button>

            </div>

            <div
                id="expenseList"
                class="cards"
            >
                <!-- Expenses zitaonekana hapa -->
            </div>

        </section>

    </main>


    <script src="js/api.js"></script>

    <script>

        // Tunachukua elements kutoka HTML
        const expenseForm =
            document.getElementById("expenseForm");

        const categoryInput =
            document.getElementById("categoryInput");

        const amountInput =
            document.getElementById("amountInput");

        const descriptionInput =
            document.getElementById("descriptionInput");

        const expenseList =
            document.getElementById("expenseList");

        const message =
            document.getElementById("message");

        const refreshBtn =
            document.getElementById("refreshBtn");


        // Function ya kuonyesha expenses zote
        async function loadExpenses() {

            try {

                // Tunapata expenses kutoka backend
                const expenses = await api("/expenses");

                console.log("Expenses kutoka backend:", expenses);


                // Kama hakuna expenses
                if (!expenses || expenses.length === 0) {

                    expenseList.innerHTML = `
                        <div class="card">
                            <p>No expenses found.</p>
                        </div>
                    `;

                    return;
                }


                // Tunaonyesha expenses zote
                expenseList.innerHTML = expenses.map(expense => `

                    <div class="card">

                        <h3>
                            ${expense.category || "Expense"}
                        </h3>

                        <h2>
                            TZS ${Number(expense.amount || 0).toLocaleString()}
                        </h2>

                        <p>
                            ${expense.description || "No description"}
                        </p>

                        <p>
                            <strong>Date:</strong>
                            ${
                                expense.created_at
                                    ? new Date(expense.created_at).toLocaleString()
                                    : "-"
                            }
                        </p>

                        <button
                            type="button"
                            onclick="deleteExpense(${expense.id})"
                        >
                            Delete
                        </button>

                    </div>

                `).join("");


            } catch (error) {

                console.error("Load expenses error:", error);

                expenseList.innerHTML = `
                    <div class="card">
                        <p>
                            Failed to load expenses.
                        </p>
                    </div>
                `;

            }

        }


        // Function ya kuongeza expense
        expenseForm.addEventListener(
            "submit",
            async function(event) {

                // Zuia browser isireload page
                event.preventDefault();


                try {

                    message.textContent =
                        "Saving expense...";


                    // Tunatengeneza data ya expense
                    const expenseData = {

                        category:
                            categoryInput.value.trim(),

                        amount:
                            Number(amountInput.value),

                        description:
                            descriptionInput.value.trim() || null

                    };


                    console.log(
                        "Sending expense:",
                        expenseData
                    );


                    // Tunatuma expense kwenda backend
                    const result = await api(
                        "/expenses",
                        {
                            method: "POST",
                            body: expenseData
                        }
                    );


                    console.log(
                        "Expense saved:",
                        result
                    );


                    // Safisha form
                    expenseForm.reset();


                    // Ujumbe wa mafanikio
                    message.textContent =
                        "Expense saved successfully.";


                    // Load expenses upya
                    await loadExpenses();


                } catch (error) {

                    console.error(
                        "Save expense error:",
                        error
                    );


                    // Tunaonyesha error kwa user
                    message.textContent =
                        "Failed to save expense: " +
                        error.message;

                }

            }
        );


        // Function ya kufuta expense
        async function deleteExpense(id) {

            // Confirmation
            const confirmed = confirm(
                "Are you sure you want to delete this expense?"
            );


            if (!confirmed) {
                return;
            }


            try {

                // Delete kupitia backend
                await api(
                    `/expenses/${id}`,
                    {
                        method: "DELETE"
                    }
                );


                message.textContent =
                    "Expense deleted successfully.";


                // Refresh list
                await loadExpenses();


            } catch (error) {

                console.error(
                    "Delete expense error:",
                    error
                );

                message.textContent =
                    "Failed to delete expense: " +
                    error.message;

            }

        }


        // Refresh button
        refreshBtn.addEventListener(
            "click",
            loadExpenses
        );


        // Load expenses page inapofunguliwa
        loadExpenses();

    </script>

</body>

</html>
