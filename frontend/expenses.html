<!doctype html>

<html lang="sw">

<head>

    <meta charset="utf-8" />

    <meta
        name="viewport"
        content="width=device-width,initial-scale=1"
    />

    <title>Expenses</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    />

</head>


<body>

    <div id="nav"></div>

    <main class="container">


        <h1 data-i18n="expenses">
            Expenses
        </h1>


        <form
            id="expenseForm"
            class="card"
        >

            <h2 data-i18n="add">
                Add
            </h2>


            <!-- Category -->

            <input
                id="categoryInput"
                data-i18n-placeholder="expense_category"
                placeholder="Category e.g. Rent"
                required
            />


            <!-- Amount -->

            <input
                id="amountInput"
                type="number"
                min="0.01"
                step="0.01"
                data-i18n-placeholder="amount"
                placeholder="Amount"
                required
            />


            <!-- Description -->

            <textarea
                id="descriptionInput"
                data-i18n-placeholder="expense_description"
                placeholder="Description"
            ></textarea>


            <!-- Save Expense -->

            <button
                type="submit"
                data-i18n="save"
            >
                Save
            </button>


            <!-- Success/Error Message -->

            <p id="message"></p>

        </form>


        <section class="card">


            <div class="top">

                <h2 data-i18n="expenses">
                    All Expenses
                </h2>


                <button
                    type="button"
                    id="refreshBtn"
                >
                    Refresh
                </button>

            </div>


            <!-- Expenses zitaonekana hapa -->

            <div
                id="expenseList"
                class="cards"
            ></div>


        </section>


    </main>



    <!-- =====================================================
         API.JS
         ===================================================== -->

    <script src="js/api.js"></script>



    <!-- =====================================================
         EXPENSES JAVASCRIPT
         ===================================================== -->

    <script>


        // =====================================================
        // GET HTML ELEMENTS
        // =====================================================

        const expenseForm =
            document.getElementById(
                "expenseForm"
            );


        const categoryInput =
            document.getElementById(
                "categoryInput"
            );


        const amountInput =
            document.getElementById(
                "amountInput"
            );


        const descriptionInput =
            document.getElementById(
                "descriptionInput"
            );


        const expenseList =
            document.getElementById(
                "expenseList"
            );


        const message =
            document.getElementById(
                "message"
            );


        const refreshBtn =
            document.getElementById(
                "refreshBtn"
            );



        // =====================================================
        // LOAD EXPENSES
        // =====================================================

        async function loadExpenses() {

            try {


                // -------------------------------------------------
                // Get expenses kutoka backend
                // -------------------------------------------------

                const expenses =
                    await api(
                        "/expenses"
                    );


                console.log(
                    "Expenses kutoka backend:",
                    expenses
                );


                // -------------------------------------------------
                // Kama hakuna expenses
                // -------------------------------------------------

                if (
                    !expenses ||
                    expenses.length === 0
                ) {

                    expenseList.innerHTML = `

                        <div class="card">

                            <p>

                                ${
                                    currentLanguage === "sw"
                                        ? "Hakuna matumizi yaliyopatikana."
                                        : "No expenses found."
                                }

                            </p>

                        </div>

                    `;

                    return;
                }



                // =================================================
                // DISPLAY EXPENSES
                // =================================================

                expenseList.innerHTML =

                    expenses

                        .map(
                            expense => `

                                <div class="card">


                                    <!-- CATEGORY -->

                                    <h3>

                                        ${
                                            expense.category ||
                                            t("expense")
                                        }

                                    </h3>


                                    <!-- AMOUNT -->

                                    <h2>

                                        TZS ${Number(
                                            expense.amount || 0
                                        ).toLocaleString()}

                                    </h2>


                                    <!-- DESCRIPTION -->

                                    <p>

                                        ${
                                            expense.description ||
                                            (
                                                currentLanguage === "sw"
                                                    ? "Hakuna maelezo"
                                                    : "No description"
                                            )
                                        }

                                    </p>


                                    <!-- DATE -->

                                    <p>

                                        <strong>

                                            ${
                                                currentLanguage === "sw"
                                                    ? "Tarehe:"
                                                    : "Date:"
                                            }

                                        </strong>

                                        ${
                                            expense.created_at
                                                ? new Date(
                                                    expense.created_at
                                                  ).toLocaleString()
                                                : "-"
                                        }

                                    </p>


                                    <!-- DELETE BUTTON -->

                                    <button
                                        type="button"
                                        onclick="deleteExpense(${expense.id})"
                                    >

                                        ${t("delete")}

                                    </button>


                                </div>

                            `
                        )

                        .join("");



            } catch (error) {


                // -------------------------------------------------
                // ERROR
                // -------------------------------------------------

                console.error(
                    "Load expenses error:",
                    error
                );


                expenseList.innerHTML = `

                    <div class="card">

                        <p>

                            ${
                                currentLanguage === "sw"
                                    ? "Imeshindikana kupata matumizi."
                                    : "Failed to load expenses."
                            }

                        </p>

                    </div>

                `;

            }

        }



        // =====================================================
        // ADD EXPENSE
        // =====================================================

        expenseForm.addEventListener(
            "submit",
            async function(event) {


                // -------------------------------------------------
                // Prevent browser reload
                // -------------------------------------------------

                event.preventDefault();



                try {


                    // -------------------------------------------------
                    // Loading message
                    // -------------------------------------------------

                    message.textContent =

                        currentLanguage === "sw"
                            ? "Inahifadhi matumizi..."
                            : "Saving expense...";



                    // =================================================
                    // EXPENSE DATA
                    // =================================================

                    const expenseData = {

                        category:
                            categoryInput.value.trim(),

                        amount:
                            Number(
                                amountInput.value
                            ),

                        description:
                            descriptionInput.value.trim() ||
                            null

                    };



                    console.log(
                        "Sending expense:",
                        expenseData
                    );



                    // -------------------------------------------------
                    // Send expense to backend
                    // -------------------------------------------------

                    const result =
                        await api(
                            "/expenses",
                            {

                                method: "POST",

                                body:
                                    expenseData

                            }
                        );



                    console.log(
                        "Expense saved:",
                        result
                    );



                    // -------------------------------------------------
                    // Clear form
                    // -------------------------------------------------

                    expenseForm.reset();



                    // -------------------------------------------------
                    // Success message
                    // -------------------------------------------------

                    message.textContent =

                        currentLanguage === "sw"
                            ? "Matumizi yamehifadhiwa kikamilifu."
                            : "Expense saved successfully.";



                    // -------------------------------------------------
                    // Reload expenses
                    // -------------------------------------------------

                    await loadExpenses();



                } catch (error) {


                    // -------------------------------------------------
                    // Error
                    // -------------------------------------------------

                    console.error(
                        "Save expense error:",
                        error
                    );


                    message.textContent =

                        currentLanguage === "sw"
                            ? "Imeshindikana kuhifadhi matumizi: " +
                              error.message

                            : "Failed to save expense: " +
                              error.message;

                }

            }
        );



        // =====================================================
        // DELETE EXPENSE
        // =====================================================

        async function deleteExpense(id) {


            // -------------------------------------------------
            // Confirmation message
            // -------------------------------------------------

            const confirmed =
                confirm(

                    currentLanguage === "sw"

                        ? "Una uhakika unataka kufuta matumizi haya?"

                        : "Are you sure you want to delete this expense?"

                );



            // Kama user amecancel
            if (!confirmed) {

                return;

            }



            try {


                // -------------------------------------------------
                // Delete kupitia backend
                // -------------------------------------------------

                await api(

                    `/expenses/${id}`,

                    {

                        method: "DELETE"

                    }

                );



                // -------------------------------------------------
                // Success message
                // -------------------------------------------------

                message.textContent =

                    currentLanguage === "sw"

                        ? "Matumizi yamefutwa kikamilifu."

                        : "Expense deleted successfully.";



                // -------------------------------------------------
                // Refresh list
                // -------------------------------------------------

                await loadExpenses();



            } catch (error) {



                console.error(
                    "Delete expense error:",
                    error
                );


                message.textContent =

                    currentLanguage === "sw"

                        ? "Imeshindikana kufuta matumizi: " +
                          error.message

                        : "Failed to delete expense: " +
                          error.message;

            }

        }

        refreshBtn.addEventListener(
            "click",
            loadExpenses
        );


        loadExpenses();


    </script>


</body>

</html>
