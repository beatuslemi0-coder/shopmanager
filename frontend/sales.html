<!doctype html>

<html lang="sw">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Sales - SHOPMANAGER</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>

    <!-- =====================================================
         NAVIGATION
         ===================================================== -->

    <div id="nav"></div>


    <!-- =====================================================
         MAIN CONTENT
         ===================================================== -->

    <main class="container">


        <!-- =================================================
             PAGE TITLE
             ================================================= -->

        <h1 data-i18n="record_sale">
            Record Sale
        </h1>


        <!-- =================================================
             SALES FORM
             ================================================= -->

        <form
            id="salesForm"
            class="card"
        >


            <!-- Products Sold -->

            <h2 data-i18n="products_sold">
                Products Sold
            </h2>


            <!--
                Hapa rows za products
                zitaongezwa na JavaScript
            -->

            <div id="saleRows"></div>


            <!-- Add Product -->

            <button
                type="button"
                id="addProductBtn"
                data-i18n="add"
            >
                + Add Product
            </button>


            <br><br>


            <!-- =================================================
                 PAYMENT METHOD
                 ================================================= -->

            <label
                for="paymentMethod"
                data-i18n="payment_method"
            >
                Payment Method
            </label>


            <select id="paymentMethod">

                <option
                    value="Cash"
                    data-i18n="cash"
                >
                    Cash
                </option>

                <option
                    value="Mobile Money"
                    data-i18n="mobile_money"
                >
                    Mobile Money
                </option>

                <option
                    value="Bank"
                    data-i18n="bank"
                >
                    Bank
                </option>

                <option
                    value="Card"
                    data-i18n="card"
                >
                    Card
                </option>

                <option
                    value="Other"
                    data-i18n="other"
                >
                    Other
                </option>

            </select>


            <br><br>


            <!-- =================================================
                 RECORD SALE BUTTON
                 ================================================= -->

            <button
                type="submit"
                id="recordSaleBtn"
                data-i18n="record_sale"
            >
                Record Sale
            </button>


            <!-- Success/Error Message -->

            <p id="saleMessage"></p>


        </form>


        <hr>


        <!-- =================================================
             SALES HISTORY
             ================================================= -->

        <h2 data-i18n="sales_history">
            Sales History
        </h2>


        <!--
            Sales zilizorekodiwa
            zitaonekana hapa
        -->

        <div
            id="salesHistory"
            class="cards"
        ></div>


    </main>


    <!-- =====================================================
         API.JS
         ===================================================== -->

    <script src="js/api.js"></script>


    <!-- =====================================================
         SALES JAVASCRIPT
         ===================================================== -->

    <script>


        // =====================================================
        // GET HTML ELEMENTS
        // =====================================================

        const salesForm =
            document.getElementById(
                "salesForm"
            );


        const saleRows =
            document.getElementById(
                "saleRows"
            );


        const addProductBtn =
            document.getElementById(
                "addProductBtn"
            );


        const paymentMethod =
            document.getElementById(
                "paymentMethod"
            );


        const recordSaleBtn =
            document.getElementById(
                "recordSaleBtn"
            );


        const saleMessage =
            document.getElementById(
                "saleMessage"
            );


        const salesHistory =
            document.getElementById(
                "salesHistory"
            );


        // =====================================================
        // PRODUCTS FROM BACKEND
        // =====================================================

        let products = [];


        // =====================================================
        // LOAD PRODUCTS
        // =====================================================

        async function loadProducts() {

            try {

                // Get products from FastAPI

                products =
                    await api(
                        "/products"
                    );


                // ---------------------------------------------
                // Kama hakuna bidhaa yenye stock
                // ---------------------------------------------

                if (!products.length) {

                    saleRows.innerHTML = `

                        <p>

                            ${
                                currentLanguage === "sw"
                                    ? "Hakuna bidhaa yenye stock. Tafadhali ongeza bidhaa kwanza kwenye Products."
                                    : "No products with stock available. Please add products first."
                            }

                        </p>

                    `;


                    addProductBtn.disabled =
                        true;


                    return;

                }


                // ---------------------------------------------
                // Add first product row
                // ---------------------------------------------

                addProductRow();


            } catch (error) {

                console.error(
                    "Products error:",
                    error
                );


                saleMessage.textContent =
                    currentLanguage === "sw"
                        ? "Imeshindikana kupata bidhaa: " +
                          error.message
                        : "Failed to load products: " +
                          error.message;

            }

        }


        // =====================================================
        // ADD PRODUCT ROW
        // =====================================================

        function addProductRow() {


            // ---------------------------------------------
            // Products ambazo bado ziko stock
            // ---------------------------------------------

            const availableProducts =
                products.filter(
                    product =>
                        Number(
                            product.stock_quantity
                        ) > 0
                );


            // ---------------------------------------------
            // Kama hakuna stock
            // ---------------------------------------------

            if (!availableProducts.length) {

                saleMessage.textContent =
                    currentLanguage === "sw"
                        ? "Hakuna bidhaa yenye stock."
                        : "No products with stock available.";

                return;

            }


            // ---------------------------------------------
            // Create row
            // ---------------------------------------------

            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "sale-row";


            // =================================================
            // PRODUCT SELECT
            // =================================================

            const productSelect =
                document.createElement(
                    "select"
                );


            productSelect.className =
                "productSelect";


            // ---------------------------------------------
            // Add products to select
            // ---------------------------------------------

            availableProducts.forEach(
                product => {

                    const option =
                        document.createElement(
                            "option"
                        );


                    option.value =
                        product.id;


                    option.textContent =
                        `${product.name} - ${
                            t("stock_quantity")
                        }: ${
                            product.stock_quantity
                        } - TZS ${
                            Number(
                                product.selling_price
                            ).toLocaleString()
                        }`;


                    productSelect.appendChild(
                        option
                    );

                }
            );


            // =================================================
            // QUANTITY INPUT
            // =================================================

            const quantityInput =
                document.createElement(
                    "input"
                );


            quantityInput.type =
                "number";


            quantityInput.min =
                "1";


            quantityInput.value =
                "1";


            quantityInput.className =
                "quantityInput";


            quantityInput.placeholder =
                t("quantity");


            // =================================================
            // REMOVE BUTTON
            // =================================================

            const removeBtn =
                document.createElement(
                    "button"
                );


            removeBtn.type =
                "button";


            removeBtn.textContent =
                t("delete");


            // ---------------------------------------------
            // Remove row
            // ---------------------------------------------

            removeBtn.onclick =
                function () {

                    row.remove();

                };


            // =================================================
            // ADD ELEMENTS TO ROW
            // =================================================

            row.appendChild(
                productSelect
            );


            row.appendChild(
                quantityInput
            );


            row.appendChild(
                removeBtn
            );


            // =================================================
            // ADD ROW TO PAGE
            // =================================================

            saleRows.appendChild(
                row
            );

        }


        // =====================================================
        // ADD PRODUCT BUTTON
        // =====================================================

        addProductBtn.addEventListener(
            "click",
            function () {

                addProductRow();

            }
        );


        // =====================================================
        // RECORD SALE
        // =====================================================

        salesForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                // ---------------------------------------------
                // Loading message
                // ---------------------------------------------

                saleMessage.textContent =
                    currentLanguage === "sw"
                        ? "Inarekodi mauzo..."
                        : "Recording sale...";


                // ---------------------------------------------
                // Get all rows
                // ---------------------------------------------

                const rows =
                    document.querySelectorAll(
                        ".sale-row"
                    );


                // ---------------------------------------------
                // Validate rows
                // ---------------------------------------------

                if (!rows.length) {

                    saleMessage.textContent =
                        currentLanguage === "sw"
                            ? "Tafadhali chagua bidhaa."
                            : "Please select a product.";

                    return;

                }


                // ---------------------------------------------
                // Create items array
                // ---------------------------------------------

                const items = [];


                for (
                    const row of rows
                ) {


                    const productSelect =
                        row.querySelector(
                            ".productSelect"
                        );


                    const quantityInput =
                        row.querySelector(
                            ".quantityInput"
                        );


                    const productId =
                        Number(
                            productSelect.value
                        );


                    const quantity =
                        Number(
                            quantityInput.value
                        );


                    // -----------------------------------------
                    // Validation
                    // -----------------------------------------

                    if (
                        !productId ||
                        !quantity ||
                        quantity < 1
                    ) {

                        saleMessage.textContent =
                            currentLanguage === "sw"
                                ? "Bidhaa na idadi lazima zijazwe vizuri."
                                : "Product and quantity must be entered correctly.";

                        return;

                    }


                    // -----------------------------------------
                    // Add item
                    // -----------------------------------------

                    items.push({

                        product_id:
                            productId,

                        quantity:
                            quantity

                    });

                }


                // =================================================
                // REQUEST BODY
                // =================================================

                const saleData = {

                    items:
                        items,

                    payment_method:
                        paymentMethod.value

                };


                try {


                    // ---------------------------------------------
                    // Disable button
                    // ---------------------------------------------

                    recordSaleBtn.disabled =
                        true;


                    recordSaleBtn.textContent =
                        currentLanguage === "sw"
                            ? "Inahifadhi..."
                            : "Saving...";


                    // ---------------------------------------------
                    // Send sale to FastAPI
                    // ---------------------------------------------

                    const sale =
                        await api(
                            "/sales",
                            {
                                method: "POST",

                                body:
                                    saleData
                            }
                        );


                    // =================================================
                    // SUCCESS MESSAGE
                    // =================================================

                    saleMessage.textContent =
                        currentLanguage === "sw"

                            ? `Mauzo yamehifadhiwa! Mapato: TZS ${
                                Number(
                                    sale.total_amount
                                ).toLocaleString()
                              } | Faida: TZS ${
                                Number(
                                    sale.profit
                                ).toLocaleString()
                              }`

                            : `Sale saved! Revenue: TZS ${
                                Number(
                                    sale.total_amount
                                ).toLocaleString()
                              } | Profit: TZS ${
                                Number(
                                    sale.profit
                                ).toLocaleString()
                              }`;


                    // ---------------------------------------------
                    // Clear rows
                    // ---------------------------------------------

                    saleRows.innerHTML =
                        "";


                    // ---------------------------------------------
                    // Refresh products
                    // ---------------------------------------------

                    products =
                        await api(
                            "/products"
                        );


                    // ---------------------------------------------
                    // Add new row
                    // ---------------------------------------------

                    if (products.length) {

                        addProductRow();

                    }


                    // ---------------------------------------------
                    // Refresh sales history
                    // ---------------------------------------------

                    await loadSales();


                } catch (error) {

                    console.error(
                        "Record sale error:",
                        error
                    );


                    saleMessage.textContent =
                        currentLanguage === "sw"

                            ? "Mauzo hayakurekodiwa: " +
                              error.message

                            : "Sale was not recorded: " +
                              error.message;


                } finally {


                    // ---------------------------------------------
                    // Enable button again
                    // ---------------------------------------------

                    recordSaleBtn.disabled =
                        false;


                    recordSaleBtn.textContent =
                        t("record_sale");

                }

            }
        );


        // =====================================================
        // LOAD SALES HISTORY
        // =====================================================

        async function loadSales() {

            try {


                // ---------------------------------------------
                // Get sales from backend
                // ---------------------------------------------

                const sales =
                    await api(
                        "/sales"
                    );


                // ---------------------------------------------
                // No sales
                // ---------------------------------------------

                if (!sales.length) {

                    salesHistory.innerHTML = `

                        <p>
                            ${
                                currentLanguage === "sw"
                                    ? "Hakuna mauzo bado."
                                    : "No sales yet."
                            }
                        </p>

                    `;

                    return;

                }


                // =================================================
                // DISPLAY SALES
                // =================================================

                salesHistory.innerHTML =
                    sales.map(
                        sale => `

                            <div class="card">

                                <h3>
                                    Sale #${sale.id}
                                </h3>


                                <p>

                                    <strong>
                                        ${t("payment_method")}:
                                    </strong>

                                    ${sale.payment_method}

                                </p>


                                <p>

                                    <strong>
                                        ${t("revenue")}:
                                    </strong>

                                    TZS ${Number(
                                        sale.total_amount
                                    ).toLocaleString()}

                                </p>


                                <p>

                                    <strong>
                                        ${t("cost")}:
                                    </strong>

                                    TZS ${Number(
                                        sale.total_cost
                                    ).toLocaleString()}

                                </p>


                                <p>

                                    <strong>
                                        ${t("profit")}:
                                    </strong>

                                    TZS ${Number(
                                        sale.profit
                                    ).toLocaleString()}

                                </p>


                                <p>

                                    <strong>
                                        ${
                                            currentLanguage === "sw"
                                                ? "Tarehe"
                                                : "Date"
                                        }:
                                    </strong>

                                    ${new Date(
                                        sale.created_at
                                    ).toLocaleString()}

                                </p>


                            </div>

                        `
                    ).join("");


            } catch (error) {

                console.error(
                    "Sales history error:",
                    error
                );


                salesHistory.innerHTML = `

                    <p>

                        ${
                            currentLanguage === "sw"
                                ? "Imeshindikana kupata mauzo:"
                                : "Failed to load sales:"
                        }

                        ${error.message}

                    </p>

                `;

            }

        }


        // =====================================================
        // INITIALIZE SALES PAGE
        // =====================================================

        async function initSalesPage() {

            await loadProducts();

            await loadSales();

        }


        // =====================================================
        // START
        // =====================================================

        initSalesPage();


    </script>


</body>

</html>
