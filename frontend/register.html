<!doctype html>
<html lang="sw">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Register</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="auth">
      <form id="f" class="card">
        <h1>Register</h1>
        <input id="n" placeholder="Full name" required /><input
          id="e" type="email" placeholder="Email" required
        /><input
          id="p"
          type="password"
          minlength="6"
          placeholder="Password"
          required
        /><button>Create account</button>
        <p id="m"></p>
      </form>
    </main>
    <script src="js/api.js"></script>
    <script>
      f.onsubmit = async (x) => {
        x.preventDefault();
        try {
          await register(n.value, e.value, p.value);
          location.href = "dashboard.html";
        } catch (q) {
          m.textContent = q.message;
        }
      };
    </script>
  </body>
</html>
