<!doctype html>

<html lang="sw">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Marketplace</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>

<div id="nav"></div>


<main class="container">

    <h1>Public Marketplace</h1>


    <div
        id="list"
        class="cards"
    ></div>

</main>


<script src="js/api.js"></script>


<script>

    async function loadMarketplace() {

        try {

            const advertisements =
                await api(
                    "/advertisements/public",
                    {
                        auth: false
                    }
                );


            const list =
                document.getElementById("list");


            if (!advertisements.length) {

                list.innerHTML =
                    "<p>Hakuna matangazo.</p>";

                return;
            }


            list.innerHTML =
                advertisements.map(ad => {

                    // Kama advertisement ina picha
                    const image =
                        ad.image_url
                            ? `
                                <img
                                    src="http://127.0.0.1:8000${ad.image_url}"
                                    class="product-image"
                                    alt="${ad.title}"
                                >
                            `
                            : "";


                    return `

                        <div class="card">

                            ${image}


                            <h3>
                                ${ad.title}
                            </h3>


                            <p>
                                ${ad.description || ""}
                            </p>


                            <b>
                                ${
                                    ad.price
                                        ? "TZS " +
                                          Number(ad.price)
                                          .toLocaleString()
                                        : ""
                                }
                            </b>


                            <p>
                                ${ad.business_name}
                            </p>


                            <p>
                                ${ad.location || ""}
                            </p>


                            <p>
                                ${ad.phone || ""}
                            </p>

                        </div>

                    `;

                }).join("");


        } catch (error) {

            console.error(error);

            document.getElementById("list").innerHTML = `
                <p>
                    Imeshindikana kupakia Marketplace.
                </p>
            `;
        }
    }


    // Anzisha marketplace
    loadMarketplace();

</script>

</body>

</html>
