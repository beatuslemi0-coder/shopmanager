<!doctype html>
<html lang="sw">

<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Marketplace</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>


<body>

    <!-- Navigation ya mfumo -->
    <div id="nav"></div>


    <main class="container">

        <!-- Kichwa cha Marketplace -->
        <h1 data-i18n="marketplace_title">
            Public Marketplace
        </h1>


        <!-- Sehemu ya matangazo -->
        <div
            id="list"
            class="cards"
        ></div>

    </main>


    <script src="js/api.js"></script>


    <script>

        // -----------------------------------
        // LOAD PUBLIC MARKETPLACE
        // -----------------------------------

        async function loadMarketplace() {

            try {

                // Tunapata advertisements za public
                const advertisements =
                    await api(
                        "/advertisements/public",
                        {
                            auth: false
                        }
                    );


                const list =
                    document.getElementById("list");


                // Kama hakuna matangazo
                if (!advertisements.length) {

                    list.innerHTML = `

                        <div class="card">

                            <p>
                                ${
                                    currentLanguage === "sw"
                                        ? "Hakuna matangazo."
                                        : "No advertisements found."
                                }
                            </p>

                        </div>

                    `;

                    return;
                }


                // Tuna-display advertisements zote
                list.innerHTML =

                    advertisements.map(ad => {

                        // Kama advertisement ina picha
                        const image =
                            ad.image_url

                                ? `

                                    <img
                                        src="http://127.0.0.1:8000${ad.image_url}"
                                        class="product-image"
                                        alt="${ad.title}"
                                    >

                                `

                                : "";


                        return `

                            <div class="card">

                                ${image}


                                <!-- Jina la bidhaa/tangazo -->
                                <h3>
                                    ${ad.title}
                                </h3>


                                <!-- Maelezo -->
                                <p>
                                    ${ad.description || ""}
                                </p>


                                <!-- Bei -->
                                <b>

                                    ${
                                        ad.price
                                            ? "TZS " +
                                              Number(ad.price)
                                                .toLocaleString()
                                            : ""
                                    }

                                </b>


                                <!-- Jina la biashara -->
                                <p>

                                    <strong>
                                        ${
                                            currentLanguage === "sw"
                                                ? "Biashara:"
                                                : "Business:"
                                        }
                                    </strong>

                                    ${ad.business_name || ""}

                                </p>


                                <!-- Location -->
                                <p>

                                    <strong>
                                        ${
                                            currentLanguage === "sw"
                                                ? "Mahali:"
                                                : "Location:"
                                        }
                                    </strong>

                                    ${ad.location || ""}

                                </p>


                                <!-- Simu -->
                                <p>

                                    <strong>
                                        ${
                                            currentLanguage === "sw"
                                                ? "Simu:"
                                                : "Phone:"
                                        }
                                    </strong>

                                    ${ad.phone || ""}

                                </p>

                            </div>

                        `;

                    }).join("");


            } catch (error) {

                console.error(error);


                document.getElementById("list").innerHTML = `

                    <div class="card">

                        <p>

                            ${
                                currentLanguage === "sw"
                                    ? "Imeshindikana kupakia Marketplace."
                                    : "Failed to load Marketplace."
                            }

                        </p>

                    </div>

                `;

            }

        }


        // Anzisha marketplace
        loadMarketplace();

    </script>

</body>

</html>
