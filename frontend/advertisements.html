<!doctype html>
<html lang="sw">

<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Advertisements</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>


<body>

    <!-- Navigation ya mfumo -->
    <div id="nav"></div>


    <main class="container">

        <!-- Kichwa cha ukurasa -->
        <h1 data-i18n="advertisement">
            Advertisements
        </h1>


        <!-- Form ya kutengeneza advertisement -->
        <form
            id="f"
            class="card"
        >

            <!-- Jina la tangazo -->
            <input
                id="t"
                data-i18n-placeholder="title"
                placeholder="Post title"
                required
            >


            <!-- Bei -->
            <input
                id="p"
                type="number"
                min="0"
                data-i18n-placeholder="price"
                placeholder="Price"
            >


            <!-- Kuchagua picha kutoka computer -->
            <label data-i18n="select_product_image">
                Chagua picha ya bidhaa
            </label>

            <input
                id="imageFile"
                type="file"
                accept="image/jpeg,image/png,image/webp"
                required
            >


            <!-- Preview ya picha kabla ya kupost -->
            <img
                id="imagePreview"
                class="image-preview"
                alt="Image preview"
            >


            <!-- Maelezo -->
            <textarea
                id="d"
                data-i18n-placeholder="description"
                placeholder="Description"
            ></textarea>


            <!-- Button ya kupost -->
            <button
                type="submit"
                data-i18n="publish"
            >
                Upload & Publish
            </button>

        </form>


        <!-- Matangazo ya user -->
        <h2 data-i18n="my_advertisements">
            My Advertisements
        </h2>


        <div
            id="list"
            class="cards"
        ></div>

    </main>


    <script src="js/api.js"></script>


    <script>

        // Tunapata elements kutoka HTML
        const form =
            document.getElementById("f");

        const titleInput =
            document.getElementById("t");

        const priceInput =
            document.getElementById("p");

        const descriptionInput =
            document.getElementById("d");

        const imageFileInput =
            document.getElementById("imageFile");

        const imagePreview =
            document.getElementById("imagePreview");

        const list =
            document.getElementById("list");


        // -----------------------------------
        // IMAGE PREVIEW
        // -----------------------------------

        imageFileInput.addEventListener(
            "change",
            function () {

                const file = this.files[0];


                // Kama seller hajachagua picha
                if (!file) {

                    imagePreview.src = "";

                    imagePreview.style.display = "none";

                    return;
                }


                // Tunaonyesha picha kabla ya upload
                imagePreview.src =
                    URL.createObjectURL(file);

                imagePreview.style.display =
                    "block";
            }
        );


        // -----------------------------------
        // LOAD ADVERTISEMENTS
        // -----------------------------------

        async function loadAdvertisements() {

            try {

                // Tunaomba advertisements kutoka backend
                const advertisements =
                    await api("/advertisements");


                // Kama hakuna advertisements
                if (
                    !advertisements ||
                    advertisements.length === 0
                ) {

                    list.innerHTML = `

                        <div class="card">

                            <p>
                                ${
                                    currentLanguage === "sw"
                                        ? "Hakuna matangazo yaliyopatikana."
                                        : "No advertisements found."
                                }
                            </p>

                        </div>

                    `;

                    return;
                }


                // Tuna-display advertisements
                list.innerHTML =

                    advertisements.map(ad => {

                        // Kama image ipo tunaonyesha
                        const image = ad.image_url

                            ? `

                                <img
                                    src="http://127.0.0.1:8000${ad.image_url}"
                                    class="product-image"
                                    alt="${ad.title}"
                                >

                            `

                            : "";


                        return `

                            <div class="card">

                                ${image}

                                <h3>
                                    ${ad.title}
                                </h3>

                                <p>
                                    ${ad.description || ""}
                                </p>

                                <b>

                                    ${
                                        ad.price
                                            ? "TZS " +
                                              Number(ad.price)
                                                .toLocaleString()
                                            : ""
                                    }

                                </b>

                            </div>

                        `;

                    }).join("");


            } catch (error) {

                console.error(error);


                list.innerHTML = `

                    <div class="card">

                        <p>

                            ${
                                currentLanguage === "sw"
                                    ? "Imeshindikana kupata matangazo."
                                    : "Failed to load advertisements."
                            }

                        </p>

                    </div>

                `;
            }
        }


        // -----------------------------------
        // KUPOST ADVERTISEMENT
        // -----------------------------------

        form.addEventListener(
            "submit",
            async function (event) {

                // Zuia page isireload
                event.preventDefault();


                try {

                    const file =
                        imageFileInput.files[0];


                    // Hakikisha picha imechaguliwa
                    if (!file) {

                        alert(
                            currentLanguage === "sw"
                                ? "Tafadhali chagua picha ya bidhaa."
                                : "Please select a product image."
                        );

                        return;
                    }


                    // -----------------------------------
                    // HATUA YA KWANZA
                    // Upload picha kwenda FastAPI
                    // -----------------------------------

                    const imageUrl =
                        await uploadImage(file);


                    console.log(
                        "Uploaded image:",
                        imageUrl
                    );


                    // -----------------------------------
                    // HATUA YA PILI
                    // Hifadhi Advertisement
                    // pamoja na image URL
                    // -----------------------------------

                    await api(
                        "/advertisements",
                        {
                            method: "POST",

                            body: {

                                title:
                                    titleInput.value,

                                price:
                                    priceInput.value
                                        ? Number(priceInput.value)
                                        : null,

                                description:
                                    descriptionInput.value ||
                                    null,

                                image_url:
                                    imageUrl,

                                is_published:
                                    true
                            }
                        }
                    );


                    // Success message
                    alert(
                        currentLanguage === "sw"
                            ? "Tangazo limechapishwa kwa mafanikio!"
                            : "Advertisement published successfully!"
                    );


                    // Safisha form
                    form.reset();

                    imagePreview.src = "";

                    imagePreview.style.display =
                        "none";


                    // Reload advertisements
                    loadAdvertisements();


                } catch (error) {

                    console.error(error);


                    alert(

                        currentLanguage === "sw"

                            ? "Hitilafu: " + error.message

                            : "Error: " + error.message

                    );

                }

            }
        );


        // Load advertisements page ikifunguka
        loadAdvertisements();

    </script>

</body>

</html>
