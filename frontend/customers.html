<!doctype html>
<html lang="sw">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Customers</title>

    <link rel="stylesheet" href="css/style.css" />
</head>

<body>

    <!-- Navigation ya mfumo -->
    <div id="nav"></div>

    <main class="container">

        <!-- Kichwa cha ukurasa -->
        <h1 data-i18n="customers">Customers</h1>

        <!-- Form ya kuongeza customer -->
        <form id="customerForm" class="card">

            <h2 data-i18n="add_customer">Add Customer</h2>

            <input
                id="name"
                data-i18n-placeholder="customer_name"
                placeholder="Customer name"
                required
            />

            <input
                id="phone"
                data-i18n-placeholder="phone"
                placeholder="Phone"
            />

            <input
                id="email"
                type="email"
                data-i18n-placeholder="email"
                placeholder="Email"
            />

            <input
                id="address"
                data-i18n-placeholder="customer_address"
                placeholder="Address"
            />

            <textarea
                id="notes"
                data-i18n-placeholder="notes"
                placeholder="Notes"
            ></textarea>

            <button type="submit" data-i18n="add_customer">
                Add Customer
            </button>

        </form>


        <!-- Sehemu ya kuonyesha customers wote -->
        <section class="card">

            <div style="display:flex; justify-content:space-between; align-items:center; gap:10px;">

                <h2 data-i18n="all_customers">All Customers</h2>

                <!-- Button ya ku-refresh customers -->
                <button type="button" id="refreshBtn" data-i18n="refresh">
                    Refresh
                </button>

            </div>

            <!-- Ujumbe wa mfumo -->
            <p id="message"></p>

            <!-- Table ya customers -->
            <div style="overflow-x:auto;">

                <table class="data-table">

                    <thead>

                        <tr>
                            <th data-i18n="id">Id</th>
                            <th data-i18n="name">Name</th>
                            <th data-i18n="phone">Phone</th>
                            <th data-i18n="email">Email</th>
                            <th data-i18n="address">Address</th>
                            <th data-i18n="notes">Notes</th>
                            <th data-i18n="actions">Actions</th>
                        </tr>

                    </thead>

                    <tbody id="customerTableBody">

                        <!-- Customers watajazwa hapa kupitia JavaScript -->

                    </tbody>

                </table>

            </div>

        </section>

    </main>


    <script src="js/api.js"></script>

    <script>

        // Tunachukua elements tunazohitaji kutoka HTML
        const customerForm = document.getElementById("customerForm");

        const customerTableBody =
            document.getElementById("customerTableBody");

        const refreshBtn =
            document.getElementById("refreshBtn");

        const message =
            document.getElementById("message");


        // Function ya kuonyesha customers wote
        async function loadCustomers() {

            try {

                // Tunaomba customers wote kutoka backend
                const customers = await api("/customers");


                // Kama hakuna customer
                if (!customers || customers.length === 0) {

                    customerTableBody.innerHTML = `
                        <tr>
                            <td colspan="7" style="text-align:center;">
                                ${currentLanguage === "sw"
                                    ? "Hakuna wateja waliopatikana."
                                    : "No customers found."
                                }
                            </td>
                        </tr>
                    `;

                    return;
                }


                // Tunaweka customers wote kwenye table
                customerTableBody.innerHTML = customers.map(customer => `

                    <tr>

                        <td>${customer.id}</td>

                        <td>${customer.name || ""}</td>

                        <td>${customer.phone || "-"}</td>

                        <td>${customer.email || "-"}</td>

                        <td>${customer.address || "-"}</td>

                        <td>${customer.notes || "-"}</td>

                        <td>

                            <button
                                type="button"
                                onclick="editCustomer(${customer.id})"
                            >
                                ${t("edit")}
                            </button>

                            <button
                                type="button"
                                onclick="deleteCustomer(${customer.id})"
                            >
                                ${t("delete")}
                            </button>

                        </td>

                    </tr>

                `).join("");


            } catch (error) {

                // Tunaonyesha error kama backend imekataa request
                console.error(error);

                customerTableBody.innerHTML = `
                    <tr>
                        <td colspan="7" style="text-align:center;">
                            ${currentLanguage === "sw"
                                ? "Imeshindikana kupakia wateja."
                                : "Failed to load customers."
                            }
                        </td>
                    </tr>
                `;
            }
        }


        // Function ya kuongeza customer mpya
        customerForm.addEventListener("submit", async function(event) {

            // Zuia page isireload
            event.preventDefault();

            try {

                // Tunatengeneza taarifa za customer
                const customerData = {

                    name:
                        document.getElementById("name").value,

                    phone:
                        document.getElementById("phone").value || null,

                    email:
                        document.getElementById("email").value || null,

                    address:
                        document.getElementById("address").value || null,

                    notes:
                        document.getElementById("notes").value || null
                };


                // Tunatuma customer kwenda backend
                await api("/customers", {

                    method: "POST",

                    body: customerData

                });


                // Tuna-reset form baada ya customer kuongezwa
                customerForm.reset();


                // Ujumbe wa mafanikio
                message.textContent =
                    currentLanguage === "sw"
                        ? "Mteja ameongezwa kwa mafanikio."
                        : "Customer added successfully.";


                // Tuna-load list upya
                await loadCustomers();


            } catch (error) {

                console.error(error);

                message.textContent =
                    currentLanguage === "sw"
                        ? "Imeshindikana kuongeza mteja."
                        : "Failed to add customer.";
            }

        });


        // Function ya kufuta customer
        async function deleteCustomer(customerId) {

            // Tunauliza confirmation kwanza
            const confirmed = confirm(
                currentLanguage === "sw"
                    ? "Una uhakika unataka kumfuta mteja huyu?"
                    : "Are you sure you want to delete this customer?"
            );


            if (!confirmed) {
                return;
            }


            try {

                // Tunafuta customer kupitia backend
                await api(`/customers/${customerId}`, {

                    method: "DELETE"

                });


                message.textContent =
                    currentLanguage === "sw"
                        ? "Mteja amefutwa kwa mafanikio."
                        : "Customer deleted successfully.";


                // Tuna-refresh list
                await loadCustomers();


            } catch (error) {

                console.error(error);

                message.textContent =
                    currentLanguage === "sw"
                        ? "Imeshindikana kufuta mteja."
                        : "Failed to delete customer.";
            }

        }


        // Function ya ku-edit customer
        async function editCustomer(customerId) {

            try {

                // Tunapata taarifa za customer
                const customers = await api("/customers");

                const customer =
                    customers.find(c => c.id === customerId);


                if (!customer) {

                    alert(
                        currentLanguage === "sw"
                            ? "Mteja hakupatikana."
                            : "Customer not found."
                    );

                    return;
                }


                // Tunaomba jina jipya
                const newName = prompt(
                    currentLanguage === "sw"
                        ? "Jina la mteja:"
                        : "Customer name:",
                    customer.name || ""
                );


                // Kama user amefunga prompt
                if (newName === null) {
                    return;
                }


                // Tunaomba simu mpya
                const newPhone = prompt(
                    currentLanguage === "sw"
                        ? "Simu:"
                        : "Phone:",
                    customer.phone || ""
                );


                if (newPhone === null) {
                    return;
                }


                // Tunaomba email mpya
                const newEmail = prompt(
                    currentLanguage === "sw"
                        ? "Barua pepe:"
                        : "Email:",
                    customer.email || ""
                );


                if (newEmail === null) {
                    return;
                }


                // Tunaomba address mpya
                const newAddress = prompt(
                    currentLanguage === "sw"
                        ? "Anwani:"
                        : "Address:",
                    customer.address || ""
                );


                if (newAddress === null) {
                    return;
                }


                // Tunaomba notes mpya
                const newNotes = prompt(
                    currentLanguage === "sw"
                        ? "Maelezo:"
                        : "Notes:",
                    customer.notes || ""
                );


                if (newNotes === null) {
                    return;
                }


                // Tunatuma taarifa mpya kwenda backend
                await api(`/customers/${customerId}`, {

                    method: "PUT",

                    body: {

                        name: newName,

                        phone: newPhone || null,

                        email: newEmail || null,

                        address: newAddress || null,

                        notes: newNotes || null

                    }

                });


                message.textContent =
                    currentLanguage === "sw"
                        ? "Mteja amesasishwa kwa mafanikio."
                        : "Customer updated successfully.";


                // Tuna-refresh list
                await loadCustomers();


            } catch (error) {

                console.error(error);

                message.textContent =
                    currentLanguage === "sw"
                        ? "Imeshindikana kusasisha mteja."
                        : "Failed to update customer.";
            }

        }


        // Button ya Refresh
        refreshBtn.addEventListener("click", loadCustomers);


        // Tunapofungua page, tuna-load customers wote
        loadCustomers();

    </script>

</body>

</html>
