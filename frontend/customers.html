<!doctype html>
<html lang="sw">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Customers</title>

    <link rel="stylesheet" href="css/style.css" />
</head>

<body>

    <!-- Navigation ya mfumo -->
    <div id="nav"></div>

    <main class="container">

        <h1>Customers</h1>

        <!-- Form ya kuongeza customer -->
        <form id="customerForm" class="card">

            <h2>Add Customer</h2>

            <input
                id="name"
                placeholder="Customer name"
                required
            />

            <input
                id="phone"
                placeholder="Phone"
            />

            <input
                id="email"
                type="email"
                placeholder="Email"
            />

            <input
                id="address"
                placeholder="Address"
            />

            <textarea
                id="notes"
                placeholder="Notes"
            ></textarea>

            <button type="submit">
                Add Customer
            </button>

        </form>


        <!-- Sehemu ya kuonyesha customers wote -->
        <section class="card">

            <div style="display:flex; justify-content:space-between; align-items:center; gap:10px;">

                <h2>All Customers</h2>

                <!-- Button ya ku-refresh customers -->
                <button type="button" id="refreshBtn">
                    Refresh
                </button>

            </div>

            <!-- Ujumbe wa mfumo -->
            <p id="message"></p>

            <!-- Table ya customers -->
            <div style="overflow-x:auto;">

                <table class="data-table">

                    <thead>

                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Phone</th>
                            <th>Email</th>
                            <th>Address</th>
                            <th>Notes</th>
                            <th>Actions</th>
                        </tr>

                    </thead>

                    <tbody id="customerTableBody">

                        <!-- Customers watajazwa hapa kupitia JavaScript -->

                    </tbody>

                </table>

            </div>

        </section>

    </main>


    <script src="js/api.js"></script>

    <script>

        // Tunachukua elements tunazohitaji kutoka HTML
        const customerForm = document.getElementById("customerForm");

        const customerTableBody =
            document.getElementById("customerTableBody");

        const refreshBtn =
            document.getElementById("refreshBtn");

        const message =
            document.getElementById("message");


        // Function ya kuonyesha customers wote
        async function loadCustomers() {

            try {

                // Tunaomba customers wote kutoka backend
                const customers = await api("/customers");

                // Kama hakuna customer
                if (!customers || customers.length === 0) {

                    customerTableBody.innerHTML = `
                        <tr>
                            <td colspan="7" style="text-align:center;">
                                No customers found.
                            </td>
                        </tr>
                    `;

                    return;
                }


                // Tunaweka customers wote kwenye table
                customerTableBody.innerHTML = customers.map(customer => `

                    <tr>

                        <td>${customer.id}</td>

                        <td>${customer.name || ""}</td>

                        <td>${customer.phone || "-"}</td>

                        <td>${customer.email || "-"}</td>

                        <td>${customer.address || "-"}</td>

                        <td>${customer.notes || "-"}</td>

                        <td>

                            <button
                                type="button"
                                onclick="editCustomer(${customer.id})"
                            >
                                Edit
                            </button>

                            <button
                                type="button"
                                onclick="deleteCustomer(${customer.id})"
                            >
                                Delete
                            </button>

                        </td>

                    </tr>

                `).join("");


            } catch (error) {

                // Tunaonyesha error kama backend imekataa request
                console.error(error);

                customerTableBody.innerHTML = `
                    <tr>
                        <td colspan="7" style="text-align:center;">
                            Failed to load customers.
                        </td>
                    </tr>
                `;
            }
        }


        // Function ya kuongeza customer mpya
        customerForm.addEventListener("submit", async function(event) {

            // Zuia page isireload
            event.preventDefault();

            try {

                // Tunatengeneza taarifa za customer
                const customerData = {

                    name: document.getElementById("name").value,

                    phone:
                        document.getElementById("phone").value || null,

                    email:
                        document.getElementById("email").value || null,

                    address:
                        document.getElementById("address").value || null,

                    notes:
                        document.getElementById("notes").value || null
                };


                // Tunatuma customer kwenda backend
                await api("/customers", {

                    method: "POST",

                    body: customerData

                });


                // Tuna-reset form baada ya customer kuongezwa
                customerForm.reset();


                // Ujumbe wa mafanikio
                message.textContent =
                    "Customer added successfully.";


                // Tuna-load list upya
                await loadCustomers();


            } catch (error) {

                console.error(error);

                message.textContent =
                    "Failed to add customer.";

            }

        });


        // Function ya kufuta customer
        async function deleteCustomer(customerId) {

            // Tunauliza confirmation kwanza
            const confirmed = confirm(
                "Are you sure you want to delete this customer?"
            );


            if (!confirmed) {
                return;
            }


            try {

                // Tunafuta customer kupitia backend
                await api(`/customers/${customerId}`, {

                    method: "DELETE"

                });


                message.textContent =
                    "Customer deleted successfully.";


                // Tuna-refresh list
                await loadCustomers();


            } catch (error) {

                console.error(error);

                message.textContent =
                    "Failed to delete customer.";

            }

        }


        // Function ya ku-edit customer
        async function editCustomer(customerId) {

            // Kwa sasa tunapata taarifa za customer
            const customers = await api("/customers");

            const customer =
                customers.find(c => c.id === customerId);


            if (!customer) {
                alert("Customer not found.");
                return;
            }


            // Tunaomba taarifa mpya
            const newName = prompt(
                "Customer name:",
                customer.name || ""
            );


            // Kama user amefunga prompt
            if (newName === null) {
                return;
            }


            const newPhone = prompt(
                "Phone:",
                customer.phone || ""
            );


            if (newPhone === null) {
                return;
            }


            const newEmail = prompt(
                "Email:",
                customer.email || ""
            );


            if (newEmail === null) {
                return;
            }


            const newAddress = prompt(
                "Address:",
                customer.address || ""
            );


            if (newAddress === null) {
                return;
            }


            const newNotes = prompt(
                "Notes:",
                customer.notes || ""
            );


            if (newNotes === null) {
                return;
            }


            try {

                // Tunatuma taarifa mpya kwenda backend
                await api(`/customers/${customerId}`, {

                    method: "PUT",

                    body: {

                        name: newName,

                        phone: newPhone || null,

                        email: newEmail || null,

                        address: newAddress || null,

                        notes: newNotes || null

                    }

                });


                message.textContent =
                    "Customer updated successfully.";


                // Tuna-refresh list
                await loadCustomers();


            } catch (error) {

                console.error(error);

                message.textContent =
                    "Failed to update customer.";

            }

        }


        // Button ya Refresh
        refreshBtn.addEventListener("click", loadCustomers);


        // Tunapofungua page, tuna-load customers wote
        loadCustomers();

    </script>

</body>
</html>
