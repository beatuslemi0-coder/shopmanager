<!doctype html>
<html lang="sw">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Reports</title>

    <link rel="stylesheet" href="css/style.css" />
</head>

<body>

    <!-- Navigation ya mfumo -->
    <div id="nav"></div>

    <main class="container">

        <!-- Kichwa cha ukurasa -->
        <h1 data-i18n="profit_loss">
            Profit & Loss
        </h1>

        <!-- Kuchagua kipindi cha report -->
        <select id="period">

            <option value="today" data-i18n="today">
                Today
            </option>

            <option value="yesterday" data-i18n="yesterday">
                Yesterday
            </option>

            <option value="week" data-i18n="week">
                This Week
            </option>

            <option value="month" data-i18n="month">
                This Month
            </option>

            <option value="year" data-i18n="year">
                This Year
            </option>

        </select>

        <!-- Button ya kutengeneza report -->
        <button onclick="load()" data-i18n="generate">
            Generate
        </button>


        <!-- Sehemu ya kuonyesha report -->
        <div id="r" class="grid"></div>

    </main>


    <script src="js/api.js"></script>

    <script>

        // Function ya kupata na kuonyesha report
        async function load() {

            try {

                // Tunachukua kipindi kilichochaguliwa
                const selectedPeriod =
                    document.getElementById("period").value;


                // Tunaomba report kutoka backend
                const x = await api(
                    "/reports/summary?period=" + selectedPeriod
                );


                // Data tunayotaka kuonyesha
                const reportData = [

                    [
                        "revenue",
                        x.revenue
                    ],

                    [
                        "cogs",
                        x.cost_of_goods
                    ],

                    [
                        "gross_profit",
                        x.gross_profit
                    ],

                    [
                        "expenses_label",
                        x.expenses
                    ],

                    [
                        "net_profit",
                        x.net_profit
                    ],

                    [
                        "margin",
                        Number(x.profit_margin).toFixed(2) + "%"
                    ],

                    [
                        "transactions",
                        x.sales_count
                    ],

                    [
                        "products_sold",
                        x.products_sold
                    ]

                ];


                // Tuna-display report cards
                document.getElementById("r").innerHTML =

                    reportData.map(item => `

                        <div class="stat">

                            <span>
                                ${t(item[0])}
                            </span>

                            <b>
                                ${item[1]}
                            </b>

                        </div>

                    `).join("");


            } catch (error) {

                // Tunaonyesha error ikiwa request imefail
                console.error(error);

                document.getElementById("r").innerHTML = `

                    <div class="card">

                        <p>
                            ${
                                currentLanguage === "sw"
                                    ? "Imeshindikana kupata ripoti."
                                    : "Failed to load report."
                            }
                        </p>

                    </div>

                `;

            }

        }


        // Load report moja kwa moja page inapofunguka
        load();

    </script>

</body>

</html>
