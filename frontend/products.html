<!doctype html>

<html lang="sw">

<head>
  <meta charset="utf-8" />

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  />

  <title>Products</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  />
</head>

<body>

  <!-- =====================================================
       NAVIGATION
       ===================================================== -->

  <div id="nav"></div>


  <!-- =====================================================
       MAIN CONTENT
       ===================================================== -->

  <main class="container">

    <!-- PAGE TITLE -->

    <h1 data-i18n="products">
      Products
    </h1>


    <!-- ===================================================
         ADD PRODUCT FORM
         =================================================== -->

    <form id="f" class="card">

      <!-- Product Name -->

      <input
        id="n"
        data-i18n-placeholder="product_name"
        placeholder="Product name"
        required
      />


      <!-- Buying Price -->

      <input
        id="buy"
        type="number"
        min="0"
        data-i18n-placeholder="buying_price"
        placeholder="Buying price"
        required
      />


      <!-- Selling Price -->

      <input
        id="sell"
        type="number"
        min="0"
        data-i18n-placeholder="selling_price"
        placeholder="Selling price"
        required
      />


      <!-- Stock Quantity -->

      <input
        id="stock"
        type="number"
        min="0"
        data-i18n-placeholder="stock_quantity"
        placeholder="Stock quantity"
        required
      />


      <!-- Minimum Stock -->

      <input
        id="min"
        type="number"
        min="0"
        value="5"
        data-i18n-placeholder="minimum_stock"
        placeholder="Minimum stock"
      />


      <!-- SKU -->

      <input
        id="sku"
        placeholder="SKU"
      />


      <!-- Description -->

      <textarea
        id="d"
        data-i18n-placeholder="description"
        placeholder="Description"
      ></textarea>


      <!-- Add Product Button -->

      <button
        type="submit"
        data-i18n="add"
      >
        Add
      </button>

    </form>


    <!-- ===================================================
         PRODUCTS LIST
         =================================================== -->

    <div
      id="list"
      class="cards"
    ></div>

  </main>


  <!-- =====================================================
       API.JS
       ===================================================== -->

  <script src="js/api.js"></script>


  <!-- =====================================================
       PRODUCTS JAVASCRIPT
       ===================================================== -->

  <script>

    // =====================================================
    // LOAD PRODUCTS
    // =====================================================

    async function load() {

      try {

        // -------------------------------------------------
        // GET PRODUCTS FROM BACKEND
        // -------------------------------------------------

        let a = await api(
          "/products"
        );


        // -------------------------------------------------
        // DISPLAY PRODUCTS
        // -------------------------------------------------

        list.innerHTML = a

          .map(

            x => {

              // Buying price
              const buyingPrice =
                Number(
                  x.buying_price
                );


              // Selling price
              const sellingPrice =
                Number(
                  x.selling_price
                );


              // Unit profit
              const unitProfit =
                sellingPrice -
                buyingPrice;


              return `

                <div class="card">

                  <!-- Product name -->

                  <h3>
                    ${x.name}
                  </h3>


                  <!-- Buying & Selling Price -->

                  <p>
                    <strong>
                      ${t("buying_price")}:
                    </strong>

                    TZS
                    ${buyingPrice.toLocaleString()}

                    |

                    <strong>
                      ${t("selling_price")}:
                    </strong>

                    TZS
                    ${sellingPrice.toLocaleString()}
                  </p>


                  <!-- Stock -->

                  <p>

                    <strong>
                      ${t("stock_quantity")}:
                    </strong>

                    ${x.stock_quantity}

                  </p>


                  <!-- Unit Profit -->

                  <p>

                    <strong>
                      ${t("profit")}:
                    </strong>

                    TZS
                    ${unitProfit.toLocaleString()}

                  </p>

                </div>

              `;

            }

          )

          .join("");


      } catch (error) {

        console.error(
          "Products loading error:",
          error
        );

        list.innerHTML = `

          <div class="card">

            <p>
              ${error.message}
            </p>

          </div>

        `;

      }

    }


    // =====================================================
    // ADD PRODUCT
    // =====================================================

    f.onsubmit = async (e) => {

      // Prevent page reload
      e.preventDefault();


      try {

        // -------------------------------------------------
        // SEND PRODUCT TO BACKEND
        // -------------------------------------------------

        await api(
          "/products",
          {

            method: "POST",

            body: {

              name:
                n.value,

              buying_price:
                +buy.value,

              selling_price:
                +sell.value,

              stock_quantity:
                +stock.value,

              minimum_stock:
                +min.value,

              sku:
                sku.value || null,

              description:
                d.value || null

            }

          }
        );


        // -------------------------------------------------
        // CLEAR FORM
        // -------------------------------------------------

        f.reset();


        // Minimum stock ilikuwa default 5,
        // kwa hiyo tunairudisha kuwa 5 baada ya reset.

        min.value = 5;


        // -------------------------------------------------
        // RELOAD PRODUCTS
        // -------------------------------------------------

        load();


      } catch (error) {

        console.error(
          "Product creation error:",
          error
        );

        alert(
          error.message
        );

      }

    };


    // =====================================================
    // INITIAL LOAD
    // =====================================================

    load();

  </script>

</body>

</html>
