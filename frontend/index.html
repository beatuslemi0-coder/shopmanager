<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shop Manager</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <section class="public-screen" id="publicScreen" hidden>
      <header class="public-header">
        <p class="eyebrow">SHOP MANAGER</p>
        <div class="public-header__actions">
          <label class="language-picker language-picker--compact"
            ><span>Language</span
            ><select class="language-select" aria-label="Language">
              <option value="en">English</option>
              <option value="sw">Kiswahili</option>
            </select></label
          >
          <button class="button button--primary" id="publicSignIn" type="button">
            Sign in
          </button>
        </div>
      </header>
      <main>
        <div class="public-heading">
          <h1>Public listings</h1>
          <p>Browse offers from local businesses.</p>
        </div>
        <div id="publicListings" aria-live="polite"></div>
      </main>
    </section>

    <section class="auth-screen" id="authScreen">
      <form class="auth-panel" id="authForm">
        <p class="eyebrow">SHOP MANAGER</p>
        <label class="language-picker"
          ><span>Language</span
          ><select class="language-select" aria-label="Language">
            <option value="en">English</option>
            <option value="sw">Kiswahili</option>
          </select></label
        >
        <h1 id="authTitle">Sign in</h1>
        <p class="auth-copy" id="authCopy">Manage your store operations.</p>
        <div class="form-grid" id="authFields"></div>
        <div class="auth-error" id="authError" role="alert" hidden></div>
        <button
          class="button button--primary button--full"
          id="authSubmit"
          type="submit"
        >
          Sign in
        </button>
        <button class="text-button" id="authSwitch" type="button">
          Create an account
        </button>
        <button class="text-button" id="forgotPassword" type="button">
          Forgot your password?
        </button>
        <button class="text-button" id="authPublicListings" type="button">
          Browse public listings
        </button>
      </form>
    </section>

    <div class="app" id="app" hidden>
      <button
        class="menu-backdrop"
        id="menuBackdrop"
        type="button"
        aria-label="Close navigation menu"
        hidden
      ></button>
      <aside class="sidebar">
        <div class="profile">
          <button
            class="avatar"
            id="userAvatar"
            type="button"
            aria-label="Change profile picture"
            title="Change profile picture"
          >
            <span id="userAvatarInitial"></span
            ><span class="avatar-edit" aria-hidden="true">+</span>
          </button>
          <input
            id="profileImageInput"
            type="file"
            accept="image/jpeg,image/png,image/webp"
            hidden
          />
          <p class="profile__name" id="userName"></p>
          <p class="profile__email" id="userEmail"></p>
        </div>
        <nav class="nav" id="nav" aria-label="Main navigation"></nav>
        <button class="nav__item nav__logout" id="logoutBtn" type="button">
          <span>↪</span><span>Sign out</span>
        </button>
      </aside>
      <main class="main">
        <header class="topbar">
          <button
            class="menu-toggle"
            id="menuToggle"
            type="button"
            aria-label="Open navigation menu"
            aria-expanded="false"
            aria-controls="nav"
          >
            <span></span><span></span><span></span>
          </button>
          <h1 class="topbar__title" id="pageTitle">Dashboard</h1>
          <div class="topbar__actions">
            <span class="api-indicator" id="apiIndicator">Connected</span>
            <label class="language-picker language-picker--compact"
              ><span class="visually-hidden">Language</span
              ><select class="language-select" aria-label="Language">
                <option value="en">English</option>
                <option value="sw">Kiswahili</option>
              </select></label
            >
            <button
              class="theme-toggle"
              id="themeToggle"
              type="button"
              aria-label="Toggle dark mode"
            >
              <span class="theme-toggle__knob"></span>
            </button>
          </div>
        </header>
        <div id="view" class="view" aria-live="polite"></div>
        <div class="toast" id="toast" role="status" hidden></div>
      </main>
    </div>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
