<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shop Manager</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#2563eb" />
  </head>
  <body>
    <section class="auth-screen" id="authScreen">
      <div class="auth-layout">
        <aside class="auth-showcase" aria-hidden="true">
          <p class="auth-brand"><span class="auth-brand__icon">S</span> SHOP MANAGER</p>
          <div class="auth-showcase-copy">
            <p class="auth-kicker">Your business, in focus</p>
            <h2>Make every day a brighter business day.</h2>
            <p>Simple tools to keep your shop moving forward.</p>
          </div>
          <div class="auth-showcase-dots"><span></span><span></span><span></span></div>
        </aside>
        <form class="auth-panel" id="authForm">
          <div class="auth-toolbar">
            <label class="language-picker language-picker--compact">
              <span class="visually-hidden">Language</span>
              <select class="language-select" aria-label="Language">
                  <option value="en">English</option>
                  <option value="sw">Kiswahili</option>
                </select>
              </label>
            <button
              class="auth-theme-toggle"
              id="authThemeToggle"
              type="button"
              aria-label="Switch to light mode"
              aria-pressed="false"
            >
              <span class="auth-theme-toggle__label" id="authThemeLabel">Dark mode</span>
              <span class="auth-theme-toggle__track" aria-hidden="true"><span></span></span>
            </button>
          </div>
          <p class="auth-greeting" id="authGreeting">Welcome back</p>
          <h1 id="authTitle">Sign in</h1>
          <p class="auth-copy" id="authCopy">Manage your store operations.</p>
          <div class="form-grid" id="authFields"></div>
          <div class="auth-error" id="authError" role="alert" hidden></div>
          <button
            class="auth-submit"
            id="authSubmit"
            type="submit"
          >
            Sign in
          </button>
          <button class="text-button" id="authSwitch" type="button">
            Create an account
          </button>
          <button class="text-button" id="forgotPassword" type="button">
            Forgot your password?
          </button>
        </form>
      </div>
    </section>

    <div class="app" id="app" hidden>
      <button
        class="menu-backdrop"
        id="menuBackdrop"
        type="button"
        aria-label="Close navigation menu"
        hidden
      ></button>
      <aside class="sidebar">
        <div class="profile">
          <button
            class="avatar"
            id="userAvatar"
            type="button"
            aria-label="Change profile picture"
            title="Change profile picture"
          >
            <span id="userAvatarInitial"></span
            ><span class="avatar-edit" aria-hidden="true">+</span>
          </button>
          <input
            id="profileImageInput"
            type="file"
            accept="image/jpeg,image/png,image/webp"
            hidden
          />
          <p class="profile__name" id="userName"></p>
          <p class="profile__email" id="userEmail"></p>
        </div>
        <nav class="nav" id="nav" aria-label="Main navigation"></nav>
        <button class="nav__item nav__logout" id="logoutBtn" type="button">
          <span>↪</span><span>Sign out</span>
        </button>
      </aside>
      <main class="main">
        <header class="topbar">
          <button
            class="menu-toggle"
            id="menuToggle"
            type="button"
            aria-label="Open navigation menu"
            aria-expanded="false"
            aria-controls="nav"
          >
            <span></span><span></span><span></span>
          </button>
          <h1 class="topbar__title" id="pageTitle">Dashboard</h1>
          <div class="topbar__actions">
            <span class="api-indicator" id="apiIndicator">Connected</span>
            <label class="language-picker language-picker--compact"
              ><span class="visually-hidden">Language</span
              ><select class="language-select" aria-label="Language">
                <option value="en">English</option>
                <option value="sw">Kiswahili</option>
              </select></label
            >
            <button
              class="theme-toggle"
              id="themeToggle"
              type="button"
              aria-label="Switch to dark mode"
              aria-pressed="false"
            >
              <span class="theme-toggle__knob"></span>
            </button>
          </div>
        </header>
        <div id="view" class="view" aria-live="polite"></div>
        <div class="toast" id="toast" role="status" hidden></div>
      </main>
    </div>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script src="js/offline/database.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            try {
                await openOfflineDB();
                console.log("SHOPMANAGER IndexedDB is ready!");
            } catch (error) {
                console.error("IndexedDB Error:", error);
            }
        });
    </script>

    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("./service-worker.js")
              .then((registration) => {
                console.log(
                  "SHOPMANAGER Service Worker registered:",
                    registration.scope
                );
              })
              .catch((error) => {
                console.error("Service Worker registration failed:", error);
              });
        });
      }
    </script>
          
  </body>
</html>
